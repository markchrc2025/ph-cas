name: CI
on:
  pull_request:
  push:
    branches: [main]
# One runner serves ph-cas: when a newer commit arrives on the same branch or PR, cancel the
# older run instead of letting it hold the queue (the newer commit contains its changes).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: [self-hosted, sentire, ARM64]  # the Oracle runners only, not the laptop
    steps:
      - uses: actions/checkout@v4
      - name: No em or en dashes under docs/
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' docs/ README.md VERSIONS.md; then
            echo "Em or en dash found"; exit 1; fi
  test:
    runs-on: [self-hosted, sentire, ARM64]  # the Oracle runners only, not the laptop
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with: { path: ph_cas }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: System packages
        # The self-hosted runner image is minimal: it has no mysql client and an
        # empty apt cache, unlike GitHub's ubuntu-latest.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mariadb-client libmariadb-dev libmariadb-dev-compat pkg-config
      - name: MariaDB charset
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL character_set_server='utf8mb4'; SET GLOBAL collation_server='utf8mb4_unicode_ci';"
      - name: Bootstrap bench
        env: { SKIP_ASSETS: "1", DB_ROOT_PASSWORD: root }
        run: |
          # The self-hosted runner keeps its home between jobs, so two things are reused:
          #  1. the built bench (frappe, erpnext, the Python env: about 3 minutes);
          #  2. a saved database with frappe and erpnext already installed, so the test site
          #     is loaded from it and only ph_cas is installed fresh (saves the 1 to 2 minutes
          #     of installing frappe and erpnext into a new database every run).
          # Never reused: the site itself (the MariaDB service is new each job) and
          # apps/ph_cas (must be this checkout). Both caches are rebuilt from scratch when
          # scripts/bootstrap.sh, which pins the versions, changes.
          export PATH="$HOME/.local/bin:$PATH"
          STAMP="$(cat ph_cas/scripts/bootstrap.sh | sha256sum | cut -c1-16)"
          SNAPSHOT="$HOME/bench/.ci-erpnext-site.sql"
          if [ "$(cat "$HOME/bench/.ci-stamp" 2>/dev/null)" != "$STAMP" ]; then
            echo "bench cache: rebuilding"
            rm -rf "$HOME/bench"
          else
            echo "bench cache: reusing frappe and erpnext"
            rm -rf "$HOME/bench/sites/test_site" "$HOME/bench/sites/snapshot_site" "$HOME/bench/apps/ph_cas"
          fi
          if [ -s "$SNAPSHOT" ]; then
            echo "site: loading the saved frappe + erpnext database"
            export SITE_SOURCE_SQL="$SNAPSHOT"
          fi
          bash ph_cas/scripts/bootstrap.sh "$HOME/bench"
          echo "$STAMP" > "$HOME/bench/.ci-stamp"
          if [ ! -s "$SNAPSHOT" ]; then
            echo "site: saving a frappe + erpnext database for the next runs"
            cd "$HOME/bench"
            bench new-site snapshot_site --db-root-password root --admin-password admin --install-app erpnext
            DB="$(python3 -c 'import json;print(json.load(open("sites/snapshot_site/site_config.json"))["db_name"])')"
            mysqldump -h127.0.0.1 -uroot -proot --single-transaction --routines "$DB" > "$SNAPSHOT.tmp"
            mv "$SNAPSHOT.tmp" "$SNAPSHOT"
            bench drop-site snapshot_site --db-root-password root --no-backup --force
          fi
      - name: Run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/bench"
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ph_cas
