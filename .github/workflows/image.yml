name: Image
# Builds the Sentire Ledger container image on every push to main and publishes it to GHCR,
# so Enterprise pairs (B36) and standby restore tests pull a tested image instead of compiling
# ERPNext on the client's server.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    # Runs on the Oracle Arm runner. The deploy servers (Contabo) are x86, so the image is
    # built for linux/amd64 through QEMU emulation: slower than a native build, but no
    # GitHub-hosted minutes.
    runs-on: [self-hosted, sentire]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
