name: Image
# Builds the Sentire Ledger container image on every push to main and publishes it to GHCR,
# so Enterprise pairs (B36) and standby restore tests pull a tested image instead of compiling
# ERPNext on the client's server.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to GHCR (untick to only test that it builds)"
        type: boolean
        default: true
# Only the newest main needs an image: a newer push cancels an older build.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    # GitHub-hosted x86: built natively for the x86 deploy servers (no QEMU, no native-assets stage).
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' || inputs.publish }}
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
