name: Image
# Builds the Sentire Ledger container image on every push to main and publishes it to GHCR,
# so Enterprise pairs (B36) and standby restore tests pull a tested image instead of compiling
# ERPNext on the client's server.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to GHCR (untick to only test that it builds)"
        type: boolean
        default: true
# Only the newest main needs an image: a newer push cancels an older build.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    # Runs on the Oracle Arm runner. The deploy servers (Contabo) are x86, so the image is
    # built for linux/amd64 through QEMU emulation: slower than a native build, but no
    # GitHub-hosted minutes.
    # ARM64 keeps it on the Oracle VMs: the build needs more memory than the 8 GB laptop
    # runner (x64) can give it.
    runs-on: [self-hosted, sentire, ARM64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' || inputs.publish }}
          platforms: linux/amd64
          # JavaScript/CSS are compiled natively on the Arm runner (esbuild crashes under
          # QEMU); see the ASSETS note at the top of the Dockerfile.
          build-args: |
            ASSETS=native-assets
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
