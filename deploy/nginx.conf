# Multi-site nginx in front of gunicorn (8001) and socketio (9000).
# __PORT__, __SITE__ (primary site) and __DOMAIN__ (client sites domain) are substituted at start.
# A request for <name>.__DOMAIN__ is routed to the Frappe site of that exact name; every other
# hostname (the primary site itself and any alias such as cas.apps.sentire.solutions) goes to the primary site.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  client_max_body_size 50m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  map $host $frappe_site {
    default __SITE__;
    "~^(?<client>[a-z0-9-]+\.__DOMAIN_RE__)$" $client;
  }
  upstream frappe_app { server 127.0.0.1:8001 fail_timeout=0; }
  upstream frappe_socketio { server 127.0.0.1:9000 fail_timeout=0; }
  server {
    listen __PORT__ default_server;
    server_name _;
    root /home/frappe/bench/sites;
    location /assets { try_files $uri =404; expires 7d; }
    location ~ ^/protected/(.*) { internal; try_files /$frappe_site/$1 =404; }
    location /files { try_files /$frappe_site/public/$uri @webserver; }
    location /socket.io {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Frappe-Site-Name $frappe_site;
      proxy_set_header Origin $scheme://$http_host;
      proxy_set_header Host $host;
      proxy_pass http://frappe_socketio;
    }
    location / { try_files /$frappe_site/public/$uri @webserver; }
    location @webserver {
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Frappe-Site-Name $frappe_site;
      proxy_set_header Host $host;
      proxy_set_header X-Use-X-Accel-Redirect True;
      proxy_read_timeout 120;
      proxy_redirect off;
      proxy_pass http://frappe_app;
    }
  }
}
