[project]
name = "ph_cas"
authors = [{ name = "MCRC", email = "mcrc.business.solutions@gmail.com" }]
description = "BIR-registrable Philippine computerized accounting system (CAS) on ERPNext v16"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = ["reportlab>=4.0", "fonttools>=4.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.50.0,<17.0.0"
erpnext = ">=16.50.0,<17.0.0"
